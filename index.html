<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI Agent Capability Explorer</title>
  <meta name="description" content="Explore practical examples of how AI agents can support everyday digital tasks, including examples for blind and low-vision users.">
  <style>
    :root {
      --ink: #10233c;
      --muted: #526477;
      --paper: #f7f5ef;
      --surface: #ffffff;
      --surface-soft: #edf3f7;
      --navy: #0e3b63;
      --navy-dark: #092a48;
      --blue: #0969a8;
      --gold: #f2b84b;
      --border: #b5c2ce;
      --focus: #bd4b00;
      --shadow: 0 10px 30px rgba(16, 35, 60, .11);
      --radius: .75rem;
    }

    * { box-sizing: border-box; }

    html {
      font-size: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 20rem;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    button { font: inherit; }
    button { color: inherit; }

    :focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    .site-header {
      padding: 1rem clamp(1rem, 3vw, 2.5rem);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .site-header h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.6rem);
      line-height: 1.2;
    }

    .site-header p {
      margin: .35rem 0 0;
      max-width: 75ch;
      color: var(--muted);
      font-size: .95rem;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(15rem, 18rem) minmax(0, 1fr);
      min-height: calc(100vh - 4.25rem);
    }

    .capability-panel {
      border-right: 1px solid var(--border);
      background: var(--surface);
    }

    .capability-nav {
      position: sticky;
      top: 0;
      max-height: calc(100vh - 4.25rem);
      overflow: auto;
      padding: 1.25rem .85rem 2rem;
    }

    .capability-nav > p {
      margin: -.45rem .35rem .9rem;
      color: var(--muted);
      font-size: .9rem;
    }

    .eyebrow {
      margin: 0 0 .25rem;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .capability-nav h2 {
      margin: 0 .35rem .9rem;
      font-size: 1.1rem;
    }

    .capability-list {
      display: grid;
      gap: .3rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .capability-link {
      position: relative;
      display: block;
      width: 100%;
      min-height: 2.9rem;
      padding: .65rem 2rem .65rem .75rem;
      border: 1px solid transparent;
      border-radius: .5rem;
      background: transparent;
      color: var(--ink);
      text-align: left;
      text-decoration: none;
      font-size: .94rem;
      font-weight: 650;
      line-height: 1.25;
    }

    .capability-link:hover {
      border-color: var(--border);
      background: var(--surface-soft);
    }

    .capability-link[aria-current="location"] {
      border-color: var(--navy);
      background: var(--navy);
      color: #fff;
    }

    .capability-link[aria-current="location"]::after {
      position: absolute;
      top: 50%;
      right: .7rem;
      content: "›";
      color: var(--gold);
      font-size: 1.5rem;
      line-height: 1;
      transform: translateY(-52%);
    }

    .example-panel {
      min-width: 0;
      padding: clamp(1rem, 2.4vw, 2rem);
    }

    .example-card {
      display: grid;
      gap: 1rem;
      width: min(100%, 82rem);
      margin: 0 auto;
    }

    .example-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 1rem 2rem;
    }

    .example-top h2 {
      margin: .15rem 0 0;
      max-width: 28ch;
      font-size: clamp(1.55rem, 3vw, 2.4rem);
      line-height: 1.08;
      letter-spacing: -.025em;
    }

    .capability-position {
      margin: .45rem 0 0;
      color: var(--muted);
      font-weight: 700;
    }

    .example-switch {
      min-height: 3rem;
      padding: .6rem 1rem;
      border: 2px solid var(--navy);
      border-radius: .45rem;
      background: var(--surface);
      color: var(--navy);
      text-align: center;
      font-weight: 800;
      cursor: pointer;
    }

    .example-switch:hover {
      background: var(--navy);
      color: #fff;
    }

    .example-heading {
      margin: 0;
      font-size: 1.15rem;
    }

    .example-summary {
      margin: -.45rem 0 0;
      max-width: 85ch;
      color: var(--muted);
      font-size: 1.03rem;
    }

    .example-figure {
      width: 100%;
      margin: 0;
      min-height: 19rem;
      overflow: hidden;
      border: 2px solid var(--navy-dark);
      border-radius: var(--radius);
      background: #07182a;
      box-shadow: var(--shadow);
    }

    .example-image {
      display: block;
      width: 100%;
      height: min(65vh, 46rem);
      min-height: 19rem;
      object-fit: contain;
      background: #07182a;
    }


    .capability-pagination {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: .75rem;
      padding-top: .25rem;
    }

    .capability-pagination a {
      min-height: 2.75rem;
      padding: .55rem .75rem;
      border: 1px solid var(--border);
      border-radius: .45rem;
      background: var(--surface);
      color: var(--navy);
      font-weight: 750;
      text-decoration: none;
    }

    .capability-pagination a:hover {
      border-color: var(--navy);
      text-decoration: underline;
    }

    .capability-pagination .next-capability { text-align: right; }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .error-box {
      padding: 1rem;
      border: 2px solid #9d2c20;
      border-radius: .5rem;
      background: #fff0ed;
      color: #651a13;
      font-weight: 700;
    }

    @media (max-width: 58rem) {
      .app-shell { grid-template-columns: 1fr; }
      .capability-panel { border-right: 0; border-bottom: 1px solid var(--border); }
      .capability-nav { position: static; max-height: none; padding-bottom: 1rem; }
      .capability-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: .2rem;
      }
      .example-top { grid-template-columns: 1fr; align-items: start; }
      .example-switch { width: min(100%, 24rem); }
    }

    @media (max-width: 36rem) {
      .example-panel { padding: 1rem .75rem 2rem; }
      .capability-list { grid-template-columns: 1fr; }
      .example-image, .example-figure { min-height: 14rem; }
      .example-image { height: 52vh; }
      .capability-pagination {
        grid-template-columns: 1fr;
      }
      .capability-pagination a { text-align: left; }
      .capability-pagination .all-capabilities { grid-row: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    @media (prefers-contrast: more) {
      :root { --border: #536273; }
      .capability-link { border-color: var(--border); }
    }

    @media (forced-colors: active) {
      .capability-link[aria-current="location"] {
        border: 3px solid Highlight;
      }
      .example-switch { border: 2px solid ButtonText; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>AI Agent Capability Explorer</h1>
    <p id="site-introduction">Loading capabilities…</p>
  </header>

  <main class="app-shell" id="main-content">
    <div class="capability-panel">
      <nav class="capability-nav" id="capability-navigation" aria-labelledby="capability-heading" tabindex="-1">
        <h2 id="capability-heading">Choose a capability</h2>
        <p>Select a link to open its examples.</p>
        <ol class="capability-list" id="capability-list" role="list"></ol>
      </nav>
    </div>

    <section class="example-panel" id="capability-details" aria-labelledby="capability-title">
      <div class="example-card" id="selected-capability">
        <div class="example-top">
          <div>
            <h2 id="capability-title" tabindex="-1">Loading examples…</h2>
            <p class="capability-position" id="capability-position"></p>
          </div>

          <button class="example-switch" id="example-switch" type="button" aria-controls="example-content"
            aria-keyshortcuts="Control+Shift+E">
            Show Accessibility example (Control + Shift + E)
          </button>
        </div>

        <section id="example-content" aria-labelledby="example-heading">
          <h3 class="example-heading" id="example-heading">General example</h3>
          <p class="example-summary" id="example-summary"></p>

          <figure class="example-figure">
            <img class="example-image" id="example-image" src="" alt="">
          </figure>
        </section>

        <nav class="capability-pagination" aria-label="Move between capabilities">
          <a class="previous-capability" id="previous-capability" href="#">Previous capability</a>
          <a class="all-capabilities" id="all-capabilities" href="#capability-navigation"
            aria-keyshortcuts="Control+Shift+L">Back to selected capability in list (Control + Shift + L)</a>
          <a class="next-capability" id="next-capability" href="#">Next capability</a>
        </nav>

        <p class="visually-hidden" id="selection-announcement" aria-live="polite"></p>
        <div class="error-box" id="error-box" role="alert" hidden></div>
      </div>
    </section>
  </main>


  <script>
    (async function () {
      "use strict";


      function showDataError(message) {
        document.getElementById("capability-title").textContent = "Examples unavailable";
        document.getElementById("example-switch").hidden = true;
        document.getElementById("example-content").hidden = true;
        document.querySelector(".capability-pagination").hidden = true;
        var dataError = document.getElementById("error-box");
        dataError.hidden = false;
        dataError.textContent = message;
      }

      var rawData;
      try {
        var response = await fetch("new_examples.tsv", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        rawData = (await response.text()).replace(/^\uFEFF/, "").trim();
        if (!rawData) {
          throw new Error("The file is empty");
        }
      } catch (error) {
        console.error("Could not load new_examples.tsv", error);
        showDataError(
          "The examples could not be loaded from new_examples.tsv. " +
          "If you are opening this page locally, use a local web server instead of opening index.html directly."
        );
        return;
      }

      var rows;
      try {
        // TSV columns: capability ID, example ID, type, capability name, summary, full description.
        rows = rawData.split(/\r?\n/).filter(function (line) {
          return line.trim();
        }).map(function (line, index) {
          var fields = line.split("\t");
          if (fields.length < 6) {
            throw new Error("Line " + (index + 1) + " has fewer than six columns");
          }
          var row = {
            capabilityId: fields[0].trim(),
            exampleId: fields[1].trim(),
            context: fields[2].trim(),
            capability: fields[3].trim(),
            summary: fields[4].trim(),
            audioScript: fields.slice(5).join("\t").trim()
          };
          if (!row.capabilityId || !row.exampleId || !row.capability || !row.summary || !row.audioScript) {
            throw new Error("Line " + (index + 1) + " contains a required blank field");
          }
          if (row.context !== "General" && row.context !== "BLV") {
            throw new Error("Line " + (index + 1) + " has an invalid example type");
          }
          return row;
        });
      } catch (error) {
        console.error("Invalid new_examples.tsv", error);
        showDataError("new_examples.tsv could not be read: " + error.message + ".");
        return;
      }

      var imageById = {};
      try {
        var pictureDirectoryUrl = new URL("pictures/", window.location.href);
        var pictureResponse = await fetch("pictures.json", { cache: "no-store" });
        if (!pictureResponse.ok) {
          throw new Error("HTTP " + pictureResponse.status);
        }

        var pictureNames = await pictureResponse.json();
        if (!Array.isArray(pictureNames) || !pictureNames.every(function (filename) {
          return typeof filename === "string" &&
            filename.indexOf("/") === -1 && filename.indexOf("\\") === -1 &&
            /\.(avif|gif|jpe?g|png|webp)$/i.test(filename);
        })) {
          throw new Error("pictures.json must contain an array of image filenames");
        }
        var pictureFiles = pictureNames.map(function (filename) {
          return { filename: filename, url: new URL(encodeURIComponent(filename), pictureDirectoryUrl).href };
        });

        if (!pictureFiles.length) {
          throw new Error("No supported image files were listed");
        }

        Array.from(new Set(rows.map(function (row) { return row.exampleId; }))).forEach(function (exampleId) {
          var matches = pictureFiles.filter(function (picture) {
            return picture.filename.indexOf(exampleId) === 0;
          });
          if (matches.length > 1) {
            throw new Error("More than one picture begins with " + exampleId);
          }
          imageById[exampleId] = matches.length ? matches[0].url : "";
        });
      } catch (error) {
        console.error("Could not load pictures.json", error);
        showDataError(
          "The image list could not be loaded from pictures.json. " +
          error.message + "."
        );
        return;
      }

      var capabilities = [];
      var capabilityMap = new Map();

      try {
        rows.forEach(function (row) {
          if (!capabilityMap.has(row.capabilityId)) {
            var entry = {
              id: row.capabilityId,
              name: row.capability,
              examples: {}
            };
            capabilityMap.set(row.capabilityId, entry);
            capabilities.push(entry);
          }
          var capability = capabilityMap.get(row.capabilityId);
          if (capability.name !== row.capability) {
            throw new Error("Capability " + row.capabilityId + " has more than one name");
          }
          if (capability.examples[row.context]) {
            throw new Error("Capability " + row.capabilityId + " has more than one " + row.context + " example");
          }
          capability.examples[row.context] = row;
        });
      } catch (error) {
        console.error("Invalid new_examples.tsv", error);
        showDataError("new_examples.tsv could not be read: " + error.message + ".");
        return;
      }

      if (!capabilities.length) {
        showDataError("new_examples.tsv does not contain any examples.");
        return;
      }

      document.getElementById("site-introduction").textContent =
        "Choose one of " + capabilities.length +
        " capabilities. Each capability includes general and accessibility examples when both are available.";

      var state = {
        capabilityIndex: 0,
        context: "General"
      };

      var list = document.getElementById("capability-list");
      var capabilityNavigation = document.getElementById("capability-navigation");
      var selectedCapability = document.getElementById("selected-capability");
      var title = document.getElementById("capability-title");
      var position = document.getElementById("capability-position");
      var exampleHeading = document.getElementById("example-heading");
      var summary = document.getElementById("example-summary");
      var image = document.getElementById("example-image");
      var exampleFigure = image.closest("figure");
      var exampleSwitch = document.getElementById("example-switch");
      var announcement = document.getElementById("selection-announcement");
      var errorBox = document.getElementById("error-box");
      var previousCapability = document.getElementById("previous-capability");
      var nextCapability = document.getElementById("next-capability");
      var allCapabilities = document.getElementById("all-capabilities");

      function capabilityFragment(index) {
        return "#capability-" + encodeURIComponent(capabilities[index].id);
      }

      function indexFromFragment() {
        var prefix = "#capability-";
        if (window.location.hash.indexOf(prefix) !== 0) return -1;
        var capabilityId;
        try {
          capabilityId = decodeURIComponent(window.location.hash.slice(prefix.length));
        } catch (error) {
          return -1;
        }
        return capabilities.findIndex(function (capability) {
          return capability.id === capabilityId;
        });
      }

      function currentCapability() {
        return capabilities[state.capabilityIndex];
      }

      function currentExample() {
        return currentCapability().examples[state.context];
      }

      function renderCapabilities() {
        list.innerHTML = "";
        capabilities.forEach(function (capability, index) {
          var item = document.createElement("li");
          var link = document.createElement("a");
          link.className = "capability-link";
          link.textContent = capability.name;
          link.href = capabilityFragment(index);
          link.dataset.index = String(index);
          link.addEventListener("click", function (event) {
            event.preventDefault();
            selectCapability(index, true, true);
          });
          item.appendChild(link);
          list.appendChild(item);
        });
        updateCapabilityLinks();
      }

      function updateCapabilityLinks() {
        Array.prototype.forEach.call(list.querySelectorAll(".capability-link"), function (link, index) {
          if (index === state.capabilityIndex) {
            link.setAttribute("aria-current", "location");
          } else {
            link.removeAttribute("aria-current");
          }
        });
      }

      function selectCapability(index, moveFocus, updateHistory) {
        if (index < 0 || index >= capabilities.length) return;
        state.capabilityIndex = index;
        var examples = currentCapability().examples;
        state.context = examples.General ? "General" : "BLV";
        updateCapabilityLinks();
        renderExample();
        if (updateHistory && window.location.hash !== capabilityFragment(index)) {
          window.history.pushState(null, "", capabilityFragment(index));
        }
        if (moveFocus) {
          title.focus();
        }
      }

      function renderExample() {
        var capability = currentCapability();
        var example = currentExample();
        var hasGeneral = Boolean(capability.examples.General);
        var hasBlv = Boolean(capability.examples.BLV);
        var contextName = state.context === "BLV" ? "Accessibility" : "General";

        title.textContent = capability.name;
        position.textContent = "Capability " + (state.capabilityIndex + 1) + " of " + capabilities.length +
          " · " + capability.id;
        exampleHeading.textContent = contextName + " example";
        summary.textContent = example.summary;
        image.alt = example.audioScript;
        var imageUrl = imageById[example.exampleId];
        image.dataset.available = imageUrl ? "true" : "false";
        if (imageUrl) {
          errorBox.hidden = true;
          exampleFigure.hidden = false;
          image.src = imageUrl;
        } else {
          image.removeAttribute("src");
          exampleFigure.hidden = true;
          errorBox.hidden = false;
          errorBox.textContent = "No picture in pictures/ begins with " + example.exampleId + ".";
        }
        exampleSwitch.hidden = !(hasGeneral && hasBlv);
        exampleSwitch.textContent = state.context === "General"
          ? "Show Accessibility example (Control + Shift + E)"
          : "Show General example (Control + Shift + E)";
        selectedCapability.id = "capability-" + capability.id;
        document.title = capability.name + " | AI Agent Capability Explorer";
        updatePagination();
      }

      function updatePagination() {
        var previousIndex = state.capabilityIndex - 1;
        var nextIndex = state.capabilityIndex + 1;

        previousCapability.hidden = previousIndex < 0;
        if (previousIndex >= 0) {
          previousCapability.href = capabilityFragment(previousIndex);
          previousCapability.dataset.index = String(previousIndex);
          previousCapability.textContent = "Previous: " + capabilities[previousIndex].name;
        }

        nextCapability.hidden = nextIndex >= capabilities.length;
        if (nextIndex < capabilities.length) {
          nextCapability.href = capabilityFragment(nextIndex);
          nextCapability.dataset.index = String(nextIndex);
          nextCapability.textContent = "Next: " + capabilities[nextIndex].name;
        }
      }

      function selectContext(context, shouldAnnounce) {
        var capability = currentCapability();
        if (!capability.examples[context]) return;
        state.context = context;
        renderExample();
        if (shouldAnnounce) {
          announcement.textContent =
            (context === "BLV" ? "Accessibility" : "General") +
            " example selected for " + capability.name + ".";
        }
      }

      function switchExample() {
        var examples = currentCapability().examples;
        if (!(examples.General && examples.BLV)) {
          announcement.textContent = "Only the Accessibility example is available for " +
            currentCapability().name + ".";
          return;
        }
        selectContext(state.context === "General" ? "BLV" : "General", true);
      }

      function focusSelectedCapability() {
        var selectedLink = list.querySelector('[data-index="' + state.capabilityIndex + '"]');
        window.setTimeout(function () {
          if (selectedLink) {
            selectedLink.focus();
            selectedLink.scrollIntoView({ block: "center" });
          } else {
            capabilityNavigation.focus();
          }
        }, 0);
      }

      exampleSwitch.addEventListener("click", function () {
        switchExample();
      });

      [previousCapability, nextCapability].forEach(function (link) {
        link.addEventListener("click", function (event) {
          event.preventDefault();
          selectCapability(Number(link.dataset.index), true, true);
        });
      });

      allCapabilities.addEventListener("click", function (event) {
        event.preventDefault();
        focusSelectedCapability();
      });

      document.addEventListener("keydown", function (event) {
        if (event.repeat || !event.ctrlKey || !event.shiftKey || event.altKey || event.metaKey) return;
        var key = event.key.toLowerCase();
        if (key === "e") {
          event.preventDefault();
          switchExample();
        } else if (key === "l") {
          event.preventDefault();
          focusSelectedCapability();
        }
      });

      image.addEventListener("error", function () {
        if (image.dataset.available !== "true") return;
        exampleFigure.hidden = true;
        errorBox.hidden = false;
        errorBox.textContent = "The example image could not be loaded. Its text alternative is still available to screen readers.";
      });

      image.addEventListener("load", function () {
        if (image.dataset.available === "true") {
          exampleFigure.hidden = false;
          errorBox.hidden = true;
        }
      });

      window.addEventListener("popstate", function () {
        var index = indexFromFragment();
        if (index >= 0) {
          selectCapability(index, true, false);
        }
      });

      var initialIndex = indexFromFragment();
      if (initialIndex >= 0) {
        state.capabilityIndex = initialIndex;
      }
      if (!currentCapability().examples.General) {
        state.context = "BLV";
      }
      renderCapabilities();
      renderExample();
      if (initialIndex < 0) {
        window.history.replaceState(null, "", capabilityFragment(state.capabilityIndex));
      } else {
        window.requestAnimationFrame(function () {
          title.focus();
        });
      }
    }());
  </script>
</body>
</html>
